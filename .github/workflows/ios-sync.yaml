name: iOS sync & build

# 每次运行都重新读取上游最新正式 Release，并构建该次检测到的标签。
# 同版本仍然重建并覆盖 IPA；新版本创建独立的 ios-<上游标签> Release。
# IPA 保持未签名，供 LiveContainer 安装时重新签名。
on:
  schedule:
    - cron: '23 */3 * * *' # UTC 每 3 小时；避开整点，实际触发可能延迟。
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ios-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: openOMSI-Project/openOMSI
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      utag: ${{ steps.detect.outputs.utag }}
      iostag: ${{ steps.detect.outputs.iostag }}
    steps:
      - name: 检测上游最新正式版本
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/$UPSTREAM_REPO/releases/latest")"
          UTAG="$(jq -er '
            select(.draft == false and .prerelease == false)
            | .tag_name
            | select(type == "string" and length > 0)
          ' <<< "$RELEASE")"

          # 标签同时用于 Git ref、文件名和 Release URL；不允许路径分隔符。
          if [[ ! "$UTAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::上游标签不能安全用于 IPA 文件名：$UTAG"
            exit 1
          fi
          git check-ref-format "refs/tags/$UTAG"

          IOSTAG="ios-$UTAG"
          echo "utag=$UTAG" >> "$GITHUB_OUTPUT"
          echo "iostag=$IOSTAG" >> "$GITHUB_OUTPUT"
          echo "本次构建：$UPSTREAM_REPO@$UTAG -> $IOSTAG"
          {
            echo "### 本次 iOS 构建"
            echo "- 上游正式版：[$UTAG](https://github.com/$UPSTREAM_REPO/releases/tag/$UTAG)"
            echo "- iOS 发布标签：\`$IOSTAG\`"
            echo "- 即使该版本已发布，仍重新构建并覆盖 IPA。"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    runs-on: macos-15
    steps:
      - name: 获取 iOS 移植文件
        uses: actions/checkout@v4

      - name: 克隆本次检测到的上游版本
        shell: bash
        env:
          UTAG: ${{ needs.check.outputs.utag }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UTAG" --single-branch \
            "https://github.com/$UPSTREAM_REPO.git" upstream
          TAG_SHA="$(git -C upstream rev-parse "refs/tags/$UTAG^{commit}")"
          HEAD_SHA="$(git -C upstream rev-parse HEAD)"
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::上游检出提交与所选 Release 标签不一致。"
            exit 1
          fi
          echo "已检出上游 $UTAG ($HEAD_SHA)"
          echo "- 上游源码提交：\`$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 应用 iOS 覆盖文件及兼容补丁
        shell: bash
        run: |
          set -euo pipefail
          cp -R ios upstream/ios
          # 保留严格失败行为；日志显示具体失败的补丁，不回退到旧版本。
          (cd upstream && sh -x ios/sync.sh)

      - name: 准备 Rust iOS 目标并检查 Xcode
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal --target aarch64-apple-ios
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          DEVELOPER_DIR="$(xcode-select -p)"
          test -d "$DEVELOPER_DIR"
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 构建未签名 IPA
        working-directory: upstream
        shell: bash
        env:
          OPENOMSI_VERSION: ${{ needs.check.outputs.utag }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-ios.sh scripts/ios-make-ipa.sh
          sh scripts/ios-make-ipa.sh

      - name: 发布或更新对应版本的 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UTAG: ${{ needs.check.outputs.utag }}
          IOSTAG: ${{ needs.check.outputs.iostag }}
        run: |
          set -euo pipefail
          IPA="upstream/dist/ios/openOMSI-${UTAG}-ios-arm64.ipa"
          if [ ! -s "$IPA" ]; then
            echo "::error::未生成有效的 IPA：$IPA"
            ls -l upstream/dist/ios
            exit 1
          fi

          NOTES="Unofficial iOS build of openOMSI ${UTAG}, produced automatically.
          - **Unsigned** .ipa: install with **LiveContainer** (it re-signs with your own certificate).
          - Import the OMSI 2 content folder via the Files app; see \`docs/IOS.md\`.
          - Upstream release: https://github.com/${UPSTREAM_REPO}/releases/tag/${UTAG}"

          # 只有 404 才创建 Release；权限、限流或服务错误不能当作“未发布”。
          STATUS="$(curl --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/ios-release.json" --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$IOSTAG")"
          case "$STATUS" in
            200)
              gh release upload "$IOSTAG" "$IPA" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$IOSTAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
              ;;
            404)
              gh release create "$IOSTAG" "$IPA" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --title "openOMSI for iOS ($UTAG)" --notes "$NOTES"
              ;;
            *)
              echo "::error::查询 iOS Release 失败（HTTP $STATUS），停止发布。"
              exit 1
              ;;
          esac
          {
            echo "### 发布完成"
            echo "- [openOMSI for iOS ($UTAG)](https://github.com/$GITHUB_REPOSITORY/releases/tag/$IOSTAG)"
            echo "- IPA：\`openOMSI-${UTAG}-ios-arm64.ipa\`（未签名）"
          } >> "$GITHUB_STEP_SUMMARY"
